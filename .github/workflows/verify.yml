name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/DomainBridge.Console/package-lock.json
      - name: Verify
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Build agent package (unsigned)
        shell: pwsh
        run: ./installer/Agent/Build-AgentMsi.ps1
      - name: Build laboratory installer
        shell: pwsh
        run: |
          dotnet tool restore
          ./installer/TestLab/Build-TestLabMsi.ps1
      - name: Lock files unchanged by packaging
        shell: pwsh
        run: git diff --exit-code -- '*packages.lock.json'
      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            artifacts/agent-installer/*.msi
            artifacts/test-lab-installer/*.msi
          if-no-files-found: error

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
